[package]
name = "archon-embodied-cli"
version = "0.1.0"
edition = "2021"
description = "CLI entry for Archon Embodied Agent OS MVP (sim loop + episode)"

[[bin]]
name = "archon-embodied"
path = "src/main.rs"

[dependencies]
archon-embodied = { path = "../archon-embodied" }
archon-runtime = { path = "../archon-runtime" }
archon-kinetic = { path = "../archon-kinetic" }
archon-policy = { path = "../archon-policy" }
archon-perception = { path = "../archon-perception" }
archon-sim = { path = "../archon-sim" }
archon-sim-bridge = { path = "../archon-sim-bridge" }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = "0.7"

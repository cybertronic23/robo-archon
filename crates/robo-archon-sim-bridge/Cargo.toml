[package]
name = "robo-archon-sim-bridge"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic sim bridge: NDJSON stdio RobotBackend for MuJoCo/ManiSkill workers"

[dependencies]
robo-archon-embodied = { path = "../robo-archon-embodied" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "process", "time", "sync"] }

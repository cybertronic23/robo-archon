[package]
name = "robo-archon-cli"
version = "0.1.0"
edition = "2021"
description = "CLI entry for RoboArchon Agent OS MVP (sim loop + episode)"

[[bin]]
name = "robo-archon"
path = "src/main.rs"

[dependencies]
robo-archon-skills = { path = "../robo-archon-skills" }
robo-archon-embodied = { path = "../robo-archon-embodied" }
robo-archon-runtime = { path = "../robo-archon-runtime" }
robo-archon-kinetic = { path = "../robo-archon-kinetic" }
robo-archon-policy = { path = "../robo-archon-policy" }
robo-archon-perception = { path = "../robo-archon-perception" }
robo-archon-sim = { path = "../robo-archon-sim" }
robo-archon-sim-bridge = { path = "../robo-archon-sim-bridge" }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
serde_json = { workspace = true }
futures = { workspace = true }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = "0.7"
async-trait = { workspace = true }
dotenvy = "0.15.7"

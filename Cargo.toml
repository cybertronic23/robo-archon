[workspace]
members = [
    # Embodied Agent OS (physical plane) — M0/M1
    "crates/robo-archon-embodied",
    "crates/robo-archon-runtime",
    "crates/robo-archon-kinetic",
    "crates/robo-archon-policy",
    "crates/robo-archon-perception",
    "crates/robo-archon-sim-bridge",
    "crates/robo-archon-ros2",
    "crates/robo-archon-sim",
    "crates/robo-archon-cli",
    # Digital plane (re-add when crates.io/mirror is reachable):
    # "crates/archon-core",
    # "crates/archon-llm",
    # "crates/archon-tools",
    # "crates/archon-cli",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
eventsource-stream = "0.2"
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
thiserror = "=2.0.12"
clap = { version = "4", features = ["derive", "env"] }
bollard = "0.18"
rustyline = { version = "15", features = ["with-file-history"] }
dirs = "6"
toml = "0.8"
